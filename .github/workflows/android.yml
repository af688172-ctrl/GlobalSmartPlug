name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voltra
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10.2'
    - name: Build Voltra APK
      run: gradle assembleDebug
    - name: Upload Voltra APK
      uses: actions/upload-artifact@v4
      with:
        name: Voltra-debug-apk
        path: voltra/app/build/outputs/apk/debug/app-debug.apk
